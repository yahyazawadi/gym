<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GYM // LOG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <span class="logo-title">IRON // LOG</span>
        <span class="logo-status" id="connection-status">LOCAL ONLY</span>
      </div>
      <div class="date-badge" id="current-date">--/--</div>
    </header>

    <!-- Routine / Day Split Bar -->
    <nav class="split-nav" id="split-nav">
      <button class="split-tab active" data-split="PUSH">PUSH</button>
      <button class="split-tab" data-split="PULL">PULL</button>
      <button class="split-tab" data-split="LEGS">LEGS</button>
      <button class="split-tab" data-split="ALL">ALL</button>
    </nav>

    <!-- Main Content: Exercise Cards for selected split -->
    <main class="exercise-list" id="exercise-list">
      <!-- Injected dynamically via app.js -->
    </main>

    <!-- Tap-Only Quick-Log Drawer (Modal) -->
    <div class="drawer-overlay" id="drawer-overlay">
      <div class="drawer" id="log-drawer">
        <div class="drawer-header">
          <div>
            <div class="drawer-category" id="drawer-category">MACHINE // PUSH</div>
            <div class="drawer-title" id="drawer-title">SEATED CHEST PRESS</div>
          </div>
          <button class="close-btn" id="drawer-close" aria-label="Close">✕</button>
        </div>

        <div class="last-stat-banner" id="drawer-last-stat">
          LAST: <span>55.0 KG × 10 REPS</span>
        </div>

        <!-- Weight Stepper -->
        <div class="stepper-section">
          <label class="stepper-label">LOAD (KG)</label>
          <div class="stepper-row">
            <button class="step-btn" data-field="weight" data-delta="-5.0">-5</button>
            <button class="step-btn" data-field="weight" data-delta="-2.5">-2.5</button>
            <div class="step-display">
              <span class="step-val" id="val-weight">55.0</span>
              <span class="step-unit">KG</span>
            </div>
            <button class="step-btn" data-field="weight" data-delta="+2.5">+2.5</button>
            <button class="step-btn" data-field="weight" data-delta="+5.0">+5</button>
          </div>
        </div>

        <!-- Reps Stepper -->
        <div class="stepper-section">
          <label class="stepper-label">REPETITIONS</label>
          <div class="stepper-row reps-row">
            <button class="step-btn wide" data-field="reps" data-delta="-1">- 1</button>
            <div class="step-display">
              <span class="step-val" id="val-reps">10</span>
              <span class="step-unit">REPS</span>
            </div>
            <button class="step-btn wide" data-field="reps" data-delta="+1">+ 1</button>
          </div>
        </div>

        <!-- Today's Logged Sets on this machine -->
        <div class="today-sets-wrap">
          <div class="today-sets-label">TODAY'S SETS</div>
          <div class="today-sets-pills" id="today-sets-pills">
            <!-- e.g. [1: 55kg x 10] -->
          </div>
        </div>

        <!-- Submit Button -->
        <button class="log-action-btn" id="btn-save-set">LOG SET</button>
      </div>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
